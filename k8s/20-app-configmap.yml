apiVersion: v1
kind: ConfigMap
metadata:
  name: gestiontareas-config
  namespace: gestiontareas-dev
data:
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  DB_HOST: "mysql.databases.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "gestiontareas"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.MySQL8Dialect"
  AWS_S3_REGION: "us-east-1"
  APP_DATA_SEED_ENABLED: "false"
  APP_CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:4200,https://*.cloudshell.dev"
