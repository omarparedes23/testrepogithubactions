apiVersion: v1
kind: Secret
metadata:
  name: gestiontareas-secrets
  namespace: gestiontareas-dev
type: Opaque
stringData:
  # Reemplazar estos placeholders antes de aplicar en un entorno real.
  SPRING_DATASOURCE_USERNAME: "gestiontareas"
