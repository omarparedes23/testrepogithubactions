apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestiontareas
  namespace: gestiontareas-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestiontareas
  template:
    metadata:
      labels:
        app: gestiontareas
    spec:
      containers:
        - name: gestiontareas
          image: omarelunico/gestiontareas:develop
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gestiontareas-config
            - secretRef:
                name: gestiontareas-secrets
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1
              memory: 768Mi
