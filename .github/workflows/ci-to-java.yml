name: CI to java
on:
  push:
    branches: [main]
    
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo workspace actions
        uses: actions/checkout@v7

      - name: download actions java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Compilar Java
        run: mvn -B clean compile

      - name: compartir compilacion
        uses: actions/upload-artifact@v7
        with:
          name: compilacion-and-generate-artifact
          path: target/

  test:
    name: Pruebas unitarias
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo workspace actions
        uses: actions/checkout@v7
        
      - name: download actions java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Restaurar binario compilado en build
        uses: actions/download-artifact@v7
        with:
          name: compilacion-and-generate-artifact
          path: target/
      - name: Ejecutar pruebas unitarias
        run: mvn -B test
