name: CI/CD Develop - Maven y Nexus

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar Java
        run: mvn -B compile

  test:
    name: Ejecutar pruebas
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: mvn -B test

  package:
    name: Generar JAR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generar JAR
        run: mvn -B clean package -DskipTests

      - name: Subir únicamente el JAR
        uses: actions/upload-artifact@v4
        with:
          name: gestiontareas-jar
          path: target/gestiontareas-0.0.2-SNAPSHOT.jar
          if-no-files-found: error

  publish-nexus:
    name: Publicar JAR en Nexus
    needs: package
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java y credenciales Maven
        uses: actions/setup-java@v5
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          distribution: temurin
          java-version: '21'
          server-id: nexus-snapshots
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Descargar JAR generado
        uses: actions/download-artifact@v4
        with:
          name: gestiontareas-jar
          path: target

      - name: Publicar JAR en Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_SNAPSHOTS_URL: ${{ vars.NEXUS_SNAPSHOTS_URL }}
        run: |
          mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Dfile=target/gestiontareas-0.0.2-SNAPSHOT.jar \
            -DpomFile=pom.xml \
            -DgroupId=gestiontareas.com \
            -DartifactId=gestiontareas \
            -Dversion=0.0.2-SNAPSHOT \
            -Dpackaging=jar \
            -DrepositoryId=nexus-snapshots \
            -Durl="$NEXUS_SNAPSHOTS_URL" \
            -DgeneratePom=false
