name: Artifact 
on:
  push:
    branches: [feature]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
     
      - name: download actions java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: compiled to proyect
        run: mvn clean install
      - name: guardar compilacion
        uses: actions/upload-artifact@v7
        with:
          name: clases-compilada
          path: target/
        
  restore:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: obtener compilado
        uses: actions/download-artifact@v8
        with:
          name: clases-compilada
          path: target/
      - run: ls target/
   
 
